# Mount dist/wc2026/browser at /usr/share/nginx/html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Exact match takes priority over the SPA fallback. A missing asset is 404.
    location = /health {
        types { }
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files /health.json =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
